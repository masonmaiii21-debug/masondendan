<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>外贸操作导航</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f4f7f6;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:28px}
.nav-container{width:min(100%,1120px)}
.nav-top{position:relative;margin-bottom:36px;text-align:center}
h1{font-size:32px;color:#1c2522;margin-bottom:9px;line-height:1.25}
.sub{color:#66736d;font-size:15px}
.lang-wrap{position:absolute;right:0;top:0;display:flex;align-items:center;gap:8px;color:#66736d;font-size:12px}
.lang-wrap select{height:34px;border:1px solid #d8e1dd;border-radius:8px;background:#fff;color:#1c2522;padding:0 10px;font:inherit}
.nav-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.nav-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 24px;border-radius:14px;text-decoration:none;color:#fff;transition:transform .2s,box-shadow .2s;min-height:210px;text-align:center}
.nav-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.18)}
.icon{font-size:48px;font-weight:800;line-height:1}
.title{font-size:24px;font-weight:700;letter-spacing:1px;line-height:1.25}
.desc{font-size:14px;opacity:.88;line-height:1.55;max-width:18em}
.card-trade{background:linear-gradient(135deg,#1f7a5c,#155b45)}
.card-shipping{background:linear-gradient(135deg,#1a6fb5,#134e7a)}
.card-air{background:linear-gradient(135deg,#0f766e,#115e59)}
.card-docs{background:linear-gradient(135deg,#7b3fa3,#5e2d7e)}
.card-air-docs{background:linear-gradient(135deg,#2563eb,#1e40af)}
.card-customs{background:linear-gradient(135deg,#c0392b,#922b21)}
@media (min-width:1440px){.nav-container{width:min(100%,1220px)}.nav-card{min-height:224px;padding:46px 28px}.icon{font-size:52px}}
@media (max-width:980px){body{align-items:start;padding:24px}.nav-container{width:100%}.nav-grid{grid-template-columns:1fr 1fr}.lang-wrap{position:static;justify-content:center;margin-top:16px}.nav-card{min-height:196px}}
@media (max-width:620px){body{padding:18px}.nav-grid{grid-template-columns:1fr;gap:14px}.nav-top{margin-bottom:22px}h1{font-size:28px}.sub{font-size:14px}.nav-card{min-height:158px;padding:28px 18px}.icon{font-size:40px}.title{font-size:22px}.desc{font-size:13px}}
</style>
</head>
<body>
<div class="nav-container">
  <div class="nav-top">
    <h1 data-i18n-zh="外贸操作管理系统" data-i18n-en="Foreign Trade Operations System">外贸操作管理系统</h1>
    <p class="sub" data-i18n-zh="Foreign Trade Operations Hub" data-i18n-en="Foreign Trade Operations Hub">Foreign Trade Operations Hub</p>
    <label class="lang-wrap">
      <span data-i18n-zh="语言" data-i18n-en="Language">语言</span>
      <select id="navLang">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="bilingual">中英双语</option>
      </select>
    </label>
  </div>
  <div class="nav-grid">
    <a class="nav-card card-trade" href="./index.html"><span class="icon">📋</span><span class="title" data-i18n-zh="外贸跟单" data-i18n-en="Order Follow-up">外贸跟单</span><span class="desc" data-i18n-zh="订单进度 · 问题记录 · 工作日志" data-i18n-en="Progress · Issues · Work Log">订单进度 · 问题记录 · 工作日志</span></a>
    <a class="nav-card card-shipping" href="./shipping.html"><span class="icon">🚢</span><span class="title" data-i18n-zh="海运操作" data-i18n-en="Ocean Freight">海运操作</span><span class="desc" data-i18n-zh="订舱 → 报关 → 到港 全流程" data-i18n-en="Booking → Customs → Arrival">订舱 → 报关 → 到港 全流程</span></a>
    <a class="nav-card card-air" href="./air.html"><span class="icon">✈️</span><span class="title" data-i18n-zh="空运操作" data-i18n-en="Air Freight">空运操作</span><span class="desc" data-i18n-zh="订舱 → 入仓 → 安检 → 起飞 → 到港" data-i18n-en="Booking → Warehouse → Screening → Arrival">订舱 → 入仓 → 安检 → 起飞 → 到港</span></a>
    <a class="nav-card card-docs" href="./docs.html"><span class="icon">📄</span><span class="title" data-i18n-zh="海运单证" data-i18n-en="Ocean Docs">海运单证</span><span class="desc" data-i18n-zh="海运制单 · 审单 · 交单" data-i18n-en="Draft · Review · Presentation">海运制单 · 审单 · 交单</span></a>
    <a class="nav-card card-air-docs" href="./air-docs.html"><span class="icon">🧾</span><span class="title" data-i18n-zh="空运单证" data-i18n-en="Air Docs">空运单证</span><span class="desc" data-i18n-zh="AWB · 安检 · 报关 · 到港归档" data-i18n-en="AWB · Screening · Customs · Filing">AWB · 安检 · 报关 · 到港归档</span></a>
    <a class="nav-card card-customs" href="./customs.html"><span class="icon">🛃</span><span class="title" data-i18n-zh="报关操作" data-i18n-en="Customs">报关操作</span><span class="desc" data-i18n-zh="申报 · 审单 · 查验 · 放行" data-i18n-en="Declare · Review · Inspect · Release">申报 · 审单 · 查验 · 放行</span></a>
  </div>
</div>

<script>
(function () {
  const key = "foreignTradeTracker.langMode.v1";
  const select = document.querySelector("#navLang");
  select.value = localStorage.getItem(key) || "zh";
  function textFor(el, lang) {
    const zh = el.dataset.i18nZh || "";
    const en = el.dataset.i18nEn || zh;
    if (lang === "zh") return zh;
    if (lang === "en") return en;
    return zh + " / " + en;
  }
  function apply(lang) {
    document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
    document.querySelectorAll("[data-i18n-zh]").forEach((el) => { el.textContent = textFor(el, lang); });
  }
  select.addEventListener("change", () => {
    localStorage.setItem(key, select.value);
    apply(select.value);
  });
  apply(select.value);
})();
</script>
</body>
</html>
