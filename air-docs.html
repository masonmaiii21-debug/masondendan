<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>空运单证管理</title>
<link rel="stylesheet" href="./styles.min.css" />
<style>
:root { --air-doc-primary:#2563eb; --air-doc-dark:#1e3a8a; --air-doc-soft:#eff6ff; }
.air-docs-page { background:#f5f7fb; }
.air-docs-page .app-shell { grid-template-columns:310px 1fr; }
.air-docs-page .workspace { padding:20px 24px 28px; min-width:0; }
.air-docs-page .panel { border-color:#dce5f0; box-shadow:none; border-radius:8px; }
.air-docs-sidebar { background:#152238; gap:14px; padding:18px; }
.air-docs-sidebar .brand h1 { font-size:20px; }
.air-docs-sidebar .brand p, .air-docs-sidebar .metric span, .air-docs-sidebar .order-item small, .air-docs-sidebar .order-meta { color:#c5d6eb; }
.air-docs-sidebar .order-item { min-height:68px; background:rgba(255,255,255,.055); border-color:rgba(255,255,255,.1); }
.air-docs-sidebar .order-item.active, .air-docs-sidebar .order-item:hover { background:rgba(37,99,235,.36); }
.air-docs-page .brand-mark { background:var(--air-doc-primary); }
.air-docs-page .primary { border-color:var(--air-doc-primary); background:var(--air-doc-primary); }
.air-docs-page .primary:hover { background:var(--air-doc-dark); }
.air-docs-page button, .air-docs-page .file-action, .air-docs-page input, .air-docs-page select, .air-docs-page textarea { border-radius:6px; }
.air-docs-page input:focus, .air-docs-page select:focus, .air-docs-page textarea:focus { border-color:var(--air-doc-primary); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
.air-docs-page .eyebrow, .air-docs-page #saveHint, .air-docs-page .node-badge { color:var(--air-doc-primary); }
.air-docs-page .topbar { margin-bottom:14px; align-items:center; }
.air-docs-page .topbar h2 { font-size:22px; font-weight:800; }
.topbar-actions { display:flex; align-items:center; gap:10px; }
.topbar-actions select { width:128px; min-height:34px; }
.air-docs-page .content-grid { grid-template-columns:minmax(520px,1fr) 370px; gap:14px; align-items:start; min-width:0; }
.air-docs-page .flow-panel { grid-column:1 / -1; padding:16px; overflow:hidden; }
.air-docs-page .activity-panel { grid-column:1 / -1; }
.air-docs-page .progress-chain { display:grid; grid-auto-flow:column; grid-auto-columns:150px; gap:10px; overflow-x:auto; padding:4px 2px 14px; }
.air-docs-page .chain-node { width:150px; min-height:128px; padding:10px; background:#fff; text-align:left; }
.air-docs-page .chain-node.done { background:var(--air-doc-soft); border-color:rgba(37,99,235,.28); }
.air-docs-page .chain-node.current { border-color:var(--air-doc-primary); box-shadow:0 0 0 2px rgba(37,99,235,.14); }
.air-docs-page .chain-node.done .node-dot, .air-docs-page .chain-node.current .node-dot { background:var(--air-doc-primary); }
.air-docs-page .node-stage { color:var(--muted); font-size:10px; font-weight:700; }
.air-docs-page .node-name { min-height:38px; line-height:1.35; font-size:12px; }
.air-docs-page .node-summary { min-height:18px; font-size:11px; }
.milestone-bar { display:flex; margin-bottom:12px; border-radius:8px; overflow:hidden; height:8px; background:var(--surface-soft); }
.milestone-done { height:100%; background:var(--air-doc-primary); transition:width .3s; }
.milestone-problem { height:100%; background:var(--danger); transition:width .3s; }
.node-detail { margin-top:12px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.node-detail article { border:1px solid var(--line); border-radius:7px; background:#fbfdff; padding:10px; font-size:12px; display:grid; gap:5px; }
.node-detail strong { color:var(--text); }
.node-detail span { color:var(--muted); line-height:1.45; }
.air-doc-grid, .validation-grid, .exception-grid, .glossary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.doc-check-item, .validation-grid article, .exception-grid article, .glossary-grid span { border:1px solid var(--line); border-radius:7px; background:#fff; padding:10px; display:grid; gap:5px; font-size:12px; }
.doc-check-item { grid-template-columns:minmax(0,1fr) 94px; align-items:center; }
.doc-check-item strong, .validation-grid strong, .exception-grid strong { font-size:12px; color:var(--text); }
.doc-check-item span, .validation-grid span, .exception-grid span, .glossary-grid span { color:var(--muted); line-height:1.45; }
.doc-check-item select { min-height:30px; padding:4px 6px; font-size:12px; }
.validation-grid article.ok { border-color:#b7dfc8; background:#f4fbf7; }
.validation-grid article.warn { border-color:#efc3bc; background:#fff7f5; }
.glossary-title { margin-top:18px; }
.glossary-grid span { display:block; }
.glossary-grid strong { margin-right:6px; color:var(--air-doc-dark); }
.sub-info { font-size:10px; color:#c5d6eb; margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; }
.small { min-height:30px; padding:4px 9px; font-size:12px; }
@media (max-width:1200px) {
  .air-docs-page .content-grid { grid-template-columns:1fr; }
  .air-docs-page .flow-panel, .air-docs-page .activity-panel { grid-column:auto; }
}
@media (max-width:980px) {
  .air-docs-page .app-shell { grid-template-columns:1fr; }
  .air-docs-page .workspace, .air-docs-sidebar { padding:16px; }
  .node-detail, .air-doc-grid, .validation-grid, .exception-grid, .glossary-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body class="air-docs-page">
<main class="app-shell">
  <aside class="sidebar air-docs-sidebar">
    <div class="brand">
      <div class="brand-mark">空证</div>
      <div><h1>空运单证</h1><p>AWB → 安检 → 报关 → 到港归档</p></div>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="toolbar">
      <button class="primary" id="newBtn" type="button">+ 新建空运单证</button>
      <button class="ghost" id="exportBtn" type="button" title="导出数据">⇩</button>
      <label class="ghost file-action" title="导入数据">⇧<input id="importInput" type="file" accept="application/json" /></label>
    </div>
    <div class="filters">
      <input id="searchInput" type="search" placeholder="搜索AWB、航班、机场、客户" />
      <select id="statusFilter"><option value="">全部状态</option></select>
    </div>
    <div class="order-list" id="taskList"></div>
  </aside>

  <section class="workspace">
    <header class="topbar">
      <div>
        <p class="eyebrow">工作台</p>
        <h2 id="pageTitle">选择或新建空运单证任务</h2>
      </div>
      <div class="topbar-actions">
        <select id="langSelect" title="显示语言"><option value="zh">中文</option><option value="en">English</option><option value="bilingual">中英双语</option></select>
        <a class="secondary doc-nav-button" href="./nav.html">返回导航</a>
        <button class="danger ghost hidden" id="deleteBtn" type="button">删除任务</button>
      </div>
    </header>

    <section class="panel empty-state" id="emptyState">
      <div><h2>开始制作第一份空运单证</h2><p>围绕空运 AWB、入仓、安检、报关、起飞、到港和签收归档，记录每个节点的资料状态与异常。</p><button class="primary" id="emptyNewBtn" type="button">新建空运单证任务</button></div>
    </section>

    <section class="content-grid hidden" id="editorArea">
      <section class="panel flow-panel">
        <div class="section-title"><h3>空运单证流程</h3><span id="stepProgress"></span></div>
        <div class="milestone-bar"><div class="milestone-done" id="milestoneDone" style="width:0%"></div><div class="milestone-problem" id="milestoneProblem" style="width:0%"></div></div>
        <div class="progress-chain" id="progressChain"></div>
        <div class="node-editor" id="nodeEditor">
          <div><strong id="nodeNoteTitle">步骤备注</strong><p id="nodeNoteMeta"></p></div>
          <div class="node-detail" id="nodeDetail"></div>
          <label>操作备注<textarea id="nodeNoteText" rows="3" placeholder="记录该节点的资料状态、客户反馈、航司/仓库/报关行要求等"></textarea></label>
          <div class="alarm-picker">
            <label>月<select id="nodeReminderMonth"></select></label><label>日<select id="nodeReminderDay"></select></label>
            <label>时<select id="nodeReminderHour"></select></label><label>分<select id="nodeReminderMinute"></select></label>
          </div>
          <div class="node-actions"><button class="secondary" id="clearNodeReminderBtn" type="button">清除提醒</button><button class="primary" id="saveNodeNoteBtn" type="button">保存步骤</button></div>
        </div>
      </section>

      <section class="panel reminder-panel">
        <div class="section-title"><h3>提醒</h3><span id="reminderCount"></span></div>
        <div class="reminder-list" id="reminderList"></div>
        <div class="follow-summary" id="followSummary"></div>
      </section>

      <form class="panel order-form" id="taskForm">
        <div class="section-title"><h3>空运单证任务信息</h3><span id="lastUpdated"></span></div>
        <div class="form-grid">
          <label>委托号/任务号<input id="fRef" required autocomplete="off" placeholder="例如 AFD-2026-001" /></label>
          <label>状态<select id="fStatus"></select></label>
          <label>AWB<input id="fAwbNo" autocomplete="off" placeholder="例如 123-45678901" /></label>
          <label>MAWB<input id="fMawbNo" autocomplete="off" placeholder="主运单号" /></label>
          <label>HAWB<input id="fHawbNo" autocomplete="off" placeholder="分运单号" /></label>
          <label>航班号<input id="fFlightNo" autocomplete="off" placeholder="例如 CA1234" /></label>
          <label>起飞机场 AOD<input id="fAod" autocomplete="off" maxlength="3" placeholder="例如 PVG" /></label>
          <label>目的机场 AOA<input id="fAoa" autocomplete="off" maxlength="3" placeholder="例如 LAX" /></label>
          <label>发货人 Shipper<input id="fShipper" autocomplete="off" placeholder="发货人/公司名称" /></label>
          <label>收货人 Consignee<input id="fConsignee" autocomplete="off" placeholder="收货人/公司名称" /></label>
          <label>通知方 Notify<input id="fNotifyParty" autocomplete="off" placeholder="Notify Party" /></label>
          <label>件数 Pieces<input id="fPieces" type="number" min="0" placeholder="例如 35" /></label>
          <label>实际重量 KGS<input id="fActualWeight" type="number" step="0.01" min="0" placeholder="例如 520.5" /></label>
          <label>体积重量 KGS<input id="fVolumetricWeight" type="number" step="0.01" min="0" placeholder="可按CBM*167填写" /></label>
          <label>计费重量 KGS<input id="fChargeableWeight" type="number" step="0.01" min="0" placeholder="取较大值" /></label>
          <label>截仓时间<input id="fWarehouseCutoff" type="datetime-local" /></label>
          <label>截单时间<input id="fDocCutoff" type="datetime-local" /></label>
          <label>ETD<input id="fEtd" type="datetime-local" /></label>
          <label>ETA<input id="fEta" type="datetime-local" /></label>
          <label>货物品名<input id="fCargoName" autocomplete="off" placeholder="中文/英文品名" /></label>
          <label>货物类型<select id="fCargoType"><option value="普货">普货</option><option value="锂电池货">锂电池货</option><option value="磁性货">磁性货</option><option value="粉末液体类">粉末液体类</option><option value="危险品">危险品 DG</option><option value="温控货">温控货</option><option value="超大超重货">超大超重货</option></select></label>
          <label>当前节点<select id="fStage"></select></label>
          <label style="grid-column:span 2;">备注<textarea id="fNotes" rows="3" placeholder="客户特殊要求、运单要求、安检/报关注意事项等"></textarea></label>
        </div>
        <div class="form-actions"><button class="primary" type="submit">保存修改</button><span id="saveHint"></span></div>
      </form>

      <section class="panel" style="padding:20px;">
        <div class="section-title"><h3>核心单证清单</h3><span id="docProgress"></span></div>
        <div class="air-doc-grid" id="docGrid"></div>
      </section>

      <section class="panel" style="padding:20px;">
        <div class="section-title"><h3>资料校验与异常</h3><span id="validationScore"></span></div>
        <div class="validation-grid" id="validationGrid"></div>
        <div class="section-title glossary-title"><h3>异常处理</h3><span>Exception Handling</span></div>
        <div class="exception-grid" id="exceptionGrid"></div>
        <div class="section-title glossary-title"><h3>术语速查</h3><span>Glossary</span></div>
        <div class="glossary-grid" id="glossaryGrid"></div>
      </section>

      <section class="panel issue-panel">
        <div class="section-title"><h3>问题记录</h3><span id="issueCount"></span></div>
        <form class="issue-form" id="issueForm"><textarea id="issueText" rows="3" placeholder="记录资料缺失、安检不过、报关查验、航班延误、运单错误等问题"></textarea><div class="issue-controls"><select id="issueSeverity"><option value="一般">一般</option><option value="重要">重要</option><option value="紧急">紧急</option></select><button class="secondary" type="submit">添加问题</button></div></form>
        <div class="issue-list" id="issueList"></div>
      </section>

      <section class="panel contact-panel">
        <div class="section-title"><h3>联系方式</h3><span id="contactCount"></span></div>
        <form class="contact-form" id="contactForm"><div class="contact-grid">
          <label>类型<select id="contactRole"><option value="客户">客户</option><option value="航空公司">航空公司</option><option value="空运代理">空运代理</option><option value="仓库">仓库</option><option value="报关行">报关行</option><option value="目的港代理">目的港代理</option><option value="收货人">收货人</option><option value="其他">其他</option></select></label>
          <label>姓名/备注<input id="contactNote" autocomplete="off" placeholder="联系人姓名和备注" /></label>
          <label>电话<input id="contactPhone" autocomplete="off" inputmode="tel" placeholder="例如 13800000000" /></label>
          <label>邮箱<input id="contactEmail" autocomplete="off" inputmode="email" placeholder="name@example.com" /></label>
        </div><button class="secondary" type="submit">添加联系人</button></form>
        <div class="contact-list" id="contactList"></div>
      </section>

      <section class="panel activity-panel"><div class="section-title"><h3>更新记录</h3><span id="activityCount"></span></div><div class="activity-list" id="activityList"></div></section>
    </section>
  </section>
</main>

<template id="itemTemplate">
  <button class="order-item" type="button"><span class="order-main"><strong></strong><small></small><span class="sub-info"></span></span><span class="order-meta"></span></button>
</template>
<template id="issueTemplate">
  <article class="issue-item"><div><span class="severity"></span><p></p><small></small></div><div class="issue-actions"><button class="ghost close-issue" type="button" title="解决/重开">✓</button><button class="ghost delete-issue" type="button" title="删除问题">×</button></div></article>
</template>

<script src="./air-docs-data.min.js"></script>
<script src="./air-docs.min.js"></script>
</body>
</html>
